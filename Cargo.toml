[package]
name = "EmelkaNotch"
version = "0.8.0"
edition = "2021"

[dependencies]
eframe = "0.31"
sysinfo = "0.33"
serde_json = "1"
ureq = { version = "2", features = ["json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = [
    "clock",
    "std",
] }

[dependencies.windows]
version = "0.58"
features = [
    "Foundation",
    "Media_Control",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Devices_Geolocation",
    "Graphics_Imaging",
    "Storage_Streams",
    "Foundation_Collections",
]

[dependencies.windows-sys]
version = "0.59"
features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

